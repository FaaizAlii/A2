<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All banks</title>
</head>
<body>
    <h1>All banks!</h1>

        <li>

    </ul>
    {% endfor %}
</body>
</html>
